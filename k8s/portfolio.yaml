apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-deployment
  labels:
    app: portfolio
spec:
  replicas: 3 # Nombre d'instances du site
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret # Le secret pour accéder à votre registre privé
      containers:
        - name: portfolio
          image: registry.perras.fr:5050/adminperras/test:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
spec:
  type: NodePort # Expose le site sur un port accessible depuis l'extérieur
  selector:
    app: portfolio
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 # Votre site sera accessible sur http://IP_WORKER:30080

